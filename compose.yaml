services:
  postgres:
    image: postgres:17
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      POSTGRES_USER: controller
      POSTGRES_PASSWORD: controller
      POSTGRES_DB: controller
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - controller_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controller -d controller"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  controller_data:
